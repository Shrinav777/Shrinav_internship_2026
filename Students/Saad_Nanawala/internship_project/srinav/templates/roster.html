<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Roster - CRUD</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f1f5f9; color: #334155; }
        
        header { background-color: #0f172a; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { color: #38bdf8; font-size: 1.5rem; font-weight: 700; text-decoration: none; }
        nav { display: flex; gap: 1.5rem; }
        nav a { color: #94a3b8; text-decoration: none; font-weight: 600; padding: 0.5rem 1rem; border-radius: 6px; }
        nav a:hover, nav a.active { color: #ffffff; background-color: #1e293b; }
        
        .container { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
        
        /* Form Section */
        .form-card { background: white; padding: 1.5rem; border-radius: 10px; border: 1px solid #e2e8f0; margin-bottom: 2rem; }
        .form-card h2 { margin-bottom: 1rem; color: #0f172a; font-size: 1.25rem; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
        input, select { padding: 0.6rem 0.8rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; outline: none; width: 100%; }
        input:focus, select:focus { border-color: #2563eb; ring: 2px #bfdbfe; }
        
        .btn { padding: 0.6rem 1.2rem; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .btn-primary { background-color: #2563eb; color: white; }
        .btn-primary:hover { background-color: #1d4ed8; }
        .btn-danger { background-color: #ef4444; color: white; }
        .btn-danger:hover { background-color: #dc2626; }
        .btn-warning { background-color: #f59e0b; color: white; }
        .btn-warning:hover { background-color: #d97706; }

        /* Table Section */
        .table-card { background: white; border-radius: 10px; border: 1px solid #e2e8f0; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background-color: #f8fafc; padding: 1rem; font-size: 0.85rem; color: #64748b; text-transform: uppercase; border-bottom: 1px solid #e2e8f0; }
        td { padding: 1rem; border-bottom: 1px solid #f1f5f9; color: #334155; }
        tr:hover { background-color: #f8fafc; }
        .actions { display: flex; gap: 0.5rem; }
    </style>
</head>
<body>

    <header>
        <a href="/" class="logo">Cric Analytics</a>
        <nav>
            <a href="/">Dashboard</a>
            <a href="/roster" class="active">Player Roster</a>
            <a href="/stats">Analytics</a>
            <a href="/about">About System</a>
        </nav>
    </header>

    <div class="container">
        <!-- Form to Add/Update Players -->
        <div class="form-card">
            <h2 id="formTitle">Add New Player</h2>
            <input type="hidden" id="playerId">
            <div class="form-grid">
                <input type="text" id="playerName" placeholder="Player Name" required>
                <select id="playerRole">
                    <option value="Batsman">Batsman</option>
                    <option value="Bowler">Bowler</option>
                    <option value="All-Rounder">All-Rounder</option>
                    <option value="Wicket-Keeper">Wicket-Keeper</option>
                </select>
                <input type="number" id="playerMatches" placeholder="Matches" min="0">
                <input type="number" id="playerRuns" placeholder="Runs Scored" min="0">
                <input type="number" id="playerWickets" placeholder="Wickets Taken" min="0">
            </div>
            <button class="btn btn-primary" id="saveBtn" onclick="savePlayer()">Save Player</button>
            <button class="btn btn-danger" id="cancelBtn" onclick="resetForm()" style="display:none;">Cancel</button>
        </div>

        <!-- Table displaying database content -->
        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Role</th>
                        <th>Matches</th>
                        <th>Runs</th>
                        <th>Wickets</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="playerTableBody">
                    <!-- Dynamic Rows Loaded via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = '/api/players';

        // FETCH ALL PLAYERS (READ)
        async function loadPlayers() {
            try {
                const response = await fetch(API_URL);
                const players = await response.json();
                
                const tbody = document.getElementById('playerTableBody');
                tbody.innerHTML = '';

                players.forEach(player => {
                    tbody.innerHTML += `
                        <tr>
                            <td>#${player.id}</td>
                            <td><strong>${player.name}</strong></td>
                            <td>${player.role}</td>
                            <td>${player.matches}</td>
                            <td>${player.runs}</td>
                            <td>${player.wickets}</td>
                            <td class="actions">
                                <button class="btn btn-warning" onclick="editPlayer(${player.id}, '${player.name}', '${player.role}', ${player.matches}, ${player.runs}, ${player.wickets})">Edit</button>
                                <button class="btn btn-danger" onclick="deletePlayer(${player.id})">Delete</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error('Error fetching data:', error);
            }
        }

        // SAVE PLAYER (CREATE / UPDATE)
        async function savePlayer() {
            const id = document.getElementById('playerId').value;
            const name = document.getElementById('playerName').value;
            const role = document.getElementById('playerRole').value;
            const matches = document.getElementById('playerMatches').value || 0;
            const runs = document.getElementById('playerRuns').value || 0;
            const wickets = document.getElementById('playerWickets').value || 0;

            if (!name) return alert('Player name is required!');

            const payload = { name, role, matches: parseInt(matches), runs: parseInt(runs), wickets: parseInt(wickets) };

            if (id) {
                // PUT Request (Update)
                await fetch(`${API_URL}/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } else {
                // POST Request (Create)
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            }

            resetForm();
            loadPlayers();
        }

        // DELETE PLAYER
        async function deletePlayer(id) {
            if (confirm('Are you sure you want to delete this record?')) {
                await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                loadPlayers();
            }
        }

        // POPULATE FORM FOR EDITING
        function editPlayer(id, name, role, matches, runs, wickets) {
            document.getElementById('playerId').value = id;
            document.getElementById('playerName').value = name;
            document.getElementById('playerRole').value = role;
            document.getElementById('playerMatches').value = matches;
            document.getElementById('playerRuns').value = runs;
            document.getElementById('playerWickets').value = wickets;

            document.getElementById('formTitle').innerText = 'Edit Player Record';
            document.getElementById('saveBtn').innerText = 'Update Player';
            document.getElementById('cancelBtn').style.display = 'inline-block';
        }

        function resetForm() {
            document.getElementById('playerId').value = '';
            document.getElementById('playerName').value = '';
            document.getElementById('playerRole').value = 'Batsman';
            document.getElementById('playerMatches').value = '';
            document.getElementById('playerRuns').value = '';
            document.getElementById('playerWickets').value = '';

            document.getElementById('formTitle').innerText = 'Add New Player';
            document.getElementById('saveBtn').innerText = 'Save Player';
            document.getElementById('cancelBtn').style.display = 'none';
        }

        // Initial Data Load
        loadPlayers();
    </script>
</body>
</html>
