spring.application.name=Day3_Shrinav

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/student}
spring.datasource.username=${POSTGRES_USER:student}
spring.datasource.password=${POSTGRES_PASSWORD:student}
spring.sql.init.mode=always


spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.show_sql=true
